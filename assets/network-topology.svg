<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="topTitle topDesc">
<title id="topTitle">High availability enterprise network topology</title>
<desc id="topDesc">Dual providers and high availability firewalls connect redundant OSPF core routers and distribution switches. A separate EIGRP branch, Wi-Fi laptop clients, data center servers, and wired VLANs are connected via unobstructed paths.</desc>
<defs>
  <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9F6FC"/></linearGradient>
  <linearGradient id="cardGrad" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F9FD"/></linearGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#A9D1E7" opacity=".64"/></pattern>
  <filter id="shadow" x="-20%" y="-25%" width="145%" height="165%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#3C7797" flood-opacity=".13"/></filter>
  <symbol id="cloud" viewBox="0 0 40 40"><path d="M9 29h22a7 7 0 0 0 0-14 11 11 0 0 0-21-1 7.5 7.5 0 0 0-1 15Z" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></symbol>
  <symbol id="firewall" viewBox="0 0 40 40"><path d="M20 3 33 9v10c0 9-5 14-13 18C12 33 7 28 7 19V9Z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m14 20 4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="router" viewBox="0 0 40 40"><rect x="5" y="10" width="30" height="21" rx="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M11 17h18m-18 8h18m-13-12-5 4 5 4m8-4 5-4m-5 16 5-4-5-4m-8 4-5-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="switch" viewBox="0 0 40 40"><rect x="3" y="11" width="34" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M10 20h4m5 0h4m5 0h3M11 16v8m21-8v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="branchIcon" viewBox="0 0 40 40"><path d="M7 34V17l13-9 13 9v17M4 17 20 5l16 12M14 34V23h12v11" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ap" viewBox="0 0 40 40"><rect x="3" y="23" width="17" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 20V13m-6 2a9 9 0 0 1 12 0M2 10a14 14 0 0 1 18 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="23" y="18" width="14" height="11" rx="1.5" stroke="currentColor" fill="none" stroke-width="1.9"/><path d="M21 33h18l-2-3H23Z" stroke="currentColor" fill="none" stroke-width="1.5"/></symbol>
  <symbol id="laptop" viewBox="0 0 40 40"><rect x="8" y="8" width="24" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 30h30l-3 4H8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="server" viewBox="0 0 40 40"><rect x="7" y="4" width="26" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 15h26M7 25h26" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="10" r="1.4" fill="currentColor"/><circle cx="13" cy="20" r="1.4" fill="currentColor"/><circle cx="13" cy="30" r="1.4" fill="currentColor"/></symbol>
  <symbol id="desktop" viewBox="0 0 40 40"><rect x="5" y="6" width="30" height="23" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 29v6m-8 0h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;fill:#21445F}
  .caption{font-size:11px;font-weight:600;fill:#6A8798}
  .zoneLabel{font-size:11px;font-weight:760;letter-spacing:.07em;fill:#34799C}
  .label{font-size:14px;font-weight:750;fill:#173A54}
  .detail{font-size:10px;font-weight:620;fill:#678398}
  .node{fill:url(#cardGrad);stroke:#BBD7E7;stroke-width:1.4;filter:url(#shadow)}
  .route{fill:none;stroke:#7EABCA;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
  .route.alt{stroke:#24A1AC}.route.branch{stroke:#D9A058}
  .packet{fill:none;stroke:#FFF;stroke-width:2.9;stroke-linecap:round;stroke-dasharray:3 13;animation:flow 2.65s linear infinite}
  .packet.alt{stroke:#C5FFF8}.packet.branch{stroke:#FFE3AF}
  .status-led{fill:#11B59C;animation:pulse 2.7s ease-in-out infinite}
  .status-led.delay{animation-delay:.9s}
  .wifi-ring{fill:none;stroke:#1BA9CD;opacity:.4;stroke-width:1.3;animation:ripple 3.2s ease-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes flow{to{stroke-dashoffset:-64}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}
  @keyframes ripple{0%{opacity:.6;transform:scale(.8)}100%{opacity:0;transform:scale(1.3)}}
  @media (prefers-reduced-motion: reduce){.packet,.status-led,.wifi-ring{animation:none!important}}
  </style>
</defs>
<rect width="1000" height="680" rx="26" fill="url(#glass)"/>
<rect x="9" y="9" width="982" height="662" rx="22" fill="url(#dots)" stroke="#D2E6F0"/>
<rect x="279" y="258" width="442" height="240" rx="23" fill="#E5F3FB" opacity=".67" stroke="#B4D7EA" stroke-dasharray="6 8"/>
<text x="40" y="42" class="eyebrow">ENTERPRISE NETWORK  /  REFERENCE ARCHITECTURE</text>
<text x="40" y="62" class="caption">Resilient routing · Zero single-core dependency · Segmented access</text>
<circle class="status-led" cx="861" cy="40" r="5"/><text x="874" y="44" class="zoneLabel" fill="#28837B">HA READY</text>
