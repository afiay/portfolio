<path class="route alt" data-from="core-b" data-to="dist-b" d="M580 348 L580 394"/>
<path class="route alt" data-from="dist-a" data-to="dist-b" d="M482 432 L518 432"/>
<path class="route branch" data-from="core-a" data-to="branch" d="M358 310 L235 310"/>
<path class="route " data-from="dist-a" data-to="wifi" d="M388 470 L388 502 L177 502 L177 534"/>
<path class="route alt" data-from="dist-a" data-to="datacenter" d="M452 470 L452 534"/>
<path class="route alt" data-from="dist-b" data-to="datacenter" d="M548 470 L548 534"/>
<path class="route " data-from="dist-b" data-to="wired" d="M612 470 L612 502 L823 502 L823 534"/></g>
  <g aria-hidden="true"><path class="packet " d="M230 126 L302 126 L302 174 L358 174"/>
<path class="packet alt" d="M770 126 L698 126 L698 174 L642 174"/>
<path class="packet " d="M420 211 L420 272"/>
<path class="packet alt" d="M580 211 L580 272"/>
<path class="packet " d="M420 348 L420 394"/>
<path class="packet alt" d="M580 348 L580 394"/>
<path class="packet branch" d="M358 310 L235 310"/>
<path class="packet " d="M388 470 L388 502 L177 502 L177 534"/>
<path class="packet alt" d="M452 470 L452 534"/>
<path class="packet alt" d="M548 470 L548 534"/>
<path class="packet " d="M612 470 L612 502 L823 502 L823 534"/></g>
<text x="500" y="250" text-anchor="middle" class="zoneLabel">OSPF AREA 0 · REDUNDANT BACKBONE</text>
<text x="500" y="372" text-anchor="middle" class="detail">CORE / DISTRIBUTION</text>
<text x="500" y="158" text-anchor="middle" class="detail">HA SYNC</text>
<text x="500" y="293" text-anchor="middle" class="detail">ECMP</text>
<text x="500" y="418" text-anchor="middle" class="detail">MLAG</text>
<rect x="274" y="279" width="72" height="22" rx="11" fill="#FFF4E3" stroke="#E9CEA3"/>
<text x="310" y="294" text-anchor="middle" font-size="10" font-weight="760" fill="#A47A42">EIGRP</text>
<g><rect class="node" data-node="isp-a" x="85" y="93" width="145" height="66" rx="15"/>
  <use href="#cloud" x="95" y="106.5" width="39" height="39" style="color:#1479B7"/>
