<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 845" role="img" aria-labelledby="mobTitle mobDesc">
<title id="mobTitle">Mobile view of a redundant enterprise network topology</title>
<desc id="mobDesc">Dual WAN paths, redundant firewalls, OSPF routers and switches, separate EIGRP branch, Wi-Fi laptop, data center and wired clients.</desc>
<defs>
  <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9F6FC"/></linearGradient>
  <linearGradient id="cardGrad" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F9FD"/></linearGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#A9D1E7" opacity=".64"/></pattern>
  <filter id="shadow" x="-20%" y="-25%" width="145%" height="165%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#3C7797" flood-opacity=".13"/></filter>
  <symbol id="cloud" viewBox="0 0 40 40"><path d="M9 29h22a7 7 0 0 0 0-14 11 11 0 0 0-21-1 7.5 7.5 0 0 0-1 15Z" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></symbol>
  <symbol id="firewall" viewBox="0 0 40 40"><path d="M20 3 33 9v10c0 9-5 14-13 18C12 33 7 28 7 19V9Z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m14 20 4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="router" viewBox="0 0 40 40"><rect x="5" y="10" width="30" height="21" rx="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M11 17h18m-18 8h18m-13-12-5 4 5 4m8-4 5-4m-5 16 5-4-5-4m-8 4-5-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="switch" viewBox="0 0 40 40"><rect x="3" y="11" width="34" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M10 20h4m5 0h4m5 0h3M11 16v8m21-8v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="branchIcon" viewBox="0 0 40 40"><path d="M7 34V17l13-9 13 9v17M4 17 20 5l16 12M14 34V23h12v11" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ap" viewBox="0 0 40 40"><rect x="3" y="23" width="17" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 20V13m-6 2a9 9 0 0 1 12 0M2 10a14 14 0 0 1 18 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="23" y="18" width="14" height="11" rx="1.5" stroke="currentColor" fill="none" stroke-width="1.9"/><path d="M21 33h18l-2-3H23Z" stroke="currentColor" fill="none" stroke-width="1.5"/></symbol>
  <symbol id="laptop" viewBox="0 0 40 40"><rect x="8" y="8" width="24" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 30h30l-3 4H8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="server" viewBox="0 0 40 40"><rect x="7" y="4" width="26" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 15h26M7 25h26" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="10" r="1.4" fill="currentColor"/><circle cx="13" cy="20" r="1.4" fill="currentColor"/><circle cx="13" cy="30" r="1.4" fill="currentColor"/></symbol>
  <symbol id="desktop" viewBox="0 0 40 40"><rect x="5" y="6" width="30" height="23" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 29v6m-8 0h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;fill:#21445F}
  .caption{font-size:11px;font-weight:600;fill:#6A8798}
  .zoneLabel{font-size:11px;font-weight:760;letter-spacing:.07em;fill:#34799C}
  .label{font-size:14px;font-weight:750;fill:#173A54}
  .detail{font-size:10px;font-weight:620;fill:#678398}
  .node{fill:url(#cardGrad);stroke:#BBD7E7;stroke-width:1.4;filter:url(#shadow)}
  .route{fill:none;stroke:#7EABCA;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
  .route.alt{stroke:#24A1AC}.route.branch{stroke:#D9A058}
  .packet{fill:none;stroke:#FFF;stroke-width:2.9;stroke-linecap:round;stroke-dasharray:3 13;animation:flow 2.65s linear infinite}
  .packet.alt{stroke:#C5FFF8}.packet.branch{stroke:#FFE3AF}
  .status-led{fill:#11B59C;animation:pulse 2.7s ease-in-out infinite}
  .status-led.delay{animation-delay:.9s}
  .wifi-ring{fill:none;stroke:#1BA9CD;opacity:.4;stroke-width:1.3;animation:ripple 3.2s ease-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes flow{to{stroke-dashoffset:-64}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}
  @keyframes ripple{0%{opacity:.6;transform:scale(.8)}100%{opacity:0;transform:scale(1.3)}}
  @media (prefers-reduced-motion: reduce){.packet,.status-led,.wifi-ring{animation:none!important}}
  </style>
</defs>
<rect width="500" height="845" rx="22" fill="url(#glass)"/>
<rect x="7" y="7" width="486" height="831" rx="17" fill="url(#dots)" stroke="#D2E6F0"/>
<rect x="82" y="291" width="336" height="227" rx="22" fill="#E5F3FB" opacity=".7" stroke="#B4D7EA" stroke-dasharray="6 8"/>
<text x="25" y="36" class="eyebrow">REDUNDANT NETWORK TOPOLOGY</text>
<text x="25" y="56" class="caption">Dual WAN · Firewalls · Routing · Access</text>
<g aria-label="Illustrative redundant network links"><path class="route " data-from="isp-a" data-to="fw-a" d="M100 147 L100 170 L155 170 L155 194"/>
<path class="route alt" data-from="isp-b" data-to="fw-b" d="M400 147 L400 170 L345 170 L345 194"/>
<path class="route alt" data-from="fw-a" data-to="fw-b" d="M210 228 L290 228"/>
<path class="route " data-from="fw-a" data-to="core-a" d="M155 263 L155 313"/>
<path class="route alt" data-from="fw-b" data-to="core-b" d="M345 263 L345 313"/>
<path class="route alt" data-from="core-a" data-to="core-b" d="M210 347 L290 347"/>
<path class="route " data-from="core-a" data-to="dist-a" d="M155 381 L155 432"/>
<path class="route alt" data-from="core-b" data-to="dist-b" d="M345 381 L345 432"/>
<path class="route alt" data-from="dist-a" data-to="dist-b" d="M210 466 L290 466"/>
<path class="route branch" data-from="core-a" data-to="branch" d="M100 347 L62 347 L62 553 L79 553 L79 577"/>
<path class="route " data-from="dist-a" data-to="wifi" d="M186 500 L186 541 L250 541 L250 577"/>
<path class="route alt" data-from="dist-b" data-to="datacenter" d="M400 466 L433 466 L433 577"/>
<path class="route " data-from="dist-b" data-to="wired" d="M345 500 L345 687 L250 687 L250 724"/></g>
  <g aria-hidden="true"><path class="packet " d="M100 147 L100 170 L155 170 L155 194"/>
<path class="packet alt" d="M400 147 L400 170 L345 170 L345 194"/>
<path class="packet " d="M155 263 L155 313"/>
<path class="packet alt" d="M345 263 L345 313"/>
<path class="packet " d="M155 381 L155 432"/>
<path class="packet alt" d="M345 381 L345 432"/>
<path class="packet branch" d="M100 347 L62 347 L62 553 L79 553 L79 577"/>
<path class="packet " d="M186 500 L186 541 L250 541 L250 577"/>
<path class="packet alt" d="M400 466 L433 466 L433 577"/>
<path class="packet " d="M345 500 L345 687 L250 687 L250 724"/></g>
<text x="250" y="299" text-anchor="middle" class="zoneLabel">OSPF BACKBONE · HA CORE</text>
<text x="250" y="182" text-anchor="middle" class="detail">HA SYNC</text>
<text x="250" y="336" text-anchor="middle" class="detail">ECMP</text>
<text x="250" y="455" text-anchor="middle" class="detail">MLAG</text>
<g><rect class="node" data-node="isp-a" x="35" y="83" width="130" height="64" rx="13"/>
  <use href="#cloud" x="41" y="100.5" width="29" height="29" style="color:#1479B7"/>
  <text x="73" y="110" class="label" style="font-size:12.5px">ISP A</text>
  <text x="73" y="127" class="detail">WAN 1</text>
  <circle class="status-led " cx="152" cy="96" r="3"/></g>
<g><rect class="node" data-node="isp-b" x="335" y="83" width="130" height="64" rx="13"/>
  <use href="#cloud" x="341" y="100.5" width="29" height="29" style="color:#0D9FAC"/>
  <text x="373" y="110" class="label" style="font-size:12.5px">ISP B</text>
  <text x="373" y="127" class="detail">WAN 2</text>
  <circle class="status-led delay" cx="452" cy="96" r="3"/></g>
<g><rect class="node" data-node="fw-a" x="100" y="194" width="110" height="69" rx="13"/>
  <use href="#firewall" x="106" y="214" width="29" height="29" style="color:#1479B7"/>
  <text x="138" y="221" class="label" style="font-size:12.5px">FW A</text>
  <text x="138" y="238" class="detail">Active</text>
  <circle class="status-led " cx="197" cy="207" r="3"/></g>
<g><rect class="node" data-node="fw-b" x="290" y="194" width="110" height="69" rx="13"/>
  <use href="#firewall" x="296" y="214" width="29" height="29" style="color:#0D9FAC"/>
  <text x="328" y="221" class="label" style="font-size:12.5px">FW B</text>
  <text x="328" y="238" class="detail">Standby</text>
  <circle class="status-led delay" cx="387" cy="207" r="3"/></g>
<g><rect class="node" data-node="core-a" x="100" y="313" width="110" height="68" rx="13"/>
  <use href="#router" x="106" y="332.5" width="29" height="29" style="color:#1479B7"/>
  <text x="138" y="340" class="label" style="font-size:12.5px">Core A</text>
  <text x="138" y="357" class="detail">OSPF</text>
  <circle class="status-led " cx="197" cy="326" r="3"/></g>
<g><rect class="node" data-node="core-b" x="290" y="313" width="110" height="68" rx="13"/>
  <use href="#router" x="296" y="332.5" width="29" height="29" style="color:#0D9FAC"/>
  <text x="328" y="340" class="label" style="font-size:12.5px">Core B</text>
  <text x="328" y="357" class="detail">OSPF</text>
  <circle class="status-led delay" cx="387" cy="326" r="3"/></g>
<g><rect class="node" data-node="dist-a" x="100" y="432" width="110" height="68" rx="13"/>
  <use href="#switch" x="106" y="451.5" width="29" height="29" style="color:#1479B7"/>
  <text x="138" y="459" class="label" style="font-size:12.5px">Dist A</text>
  <text x="138" y="476" class="detail">L3 switch</text>
  <circle class="status-led " cx="197" cy="445" r="3"/></g>
<g><rect class="node" data-node="dist-b" x="290" y="432" width="110" height="68" rx="13"/>
  <use href="#switch" x="296" y="451.5" width="29" height="29" style="color:#0D9FAC"/>
  <text x="328" y="459" class="label" style="font-size:12.5px">Dist B</text>
  <text x="328" y="476" class="detail">L3 switch</text>
  <circle class="status-led delay" cx="387" cy="445" r="3"/></g>
<g><rect class="node" data-node="branch" x="16" y="577" width="126" height="70" rx="13"/>
  <use href="#branchIcon" x="22" y="597.5" width="29" height="29" style="color:#C58C42"/>
  <text x="54" y="604" class="label" style="font-size:12.5px">Branch</text>
  <text x="54" y="621" class="detail">EIGRP</text>
  <circle class="status-led " cx="129" cy="590" r="3"/></g>
<g><rect class="node" data-node="wifi" x="190" y="577" width="120" height="70" rx="13"/>
  <use href="#ap" x="196" y="597.5" width="29" height="29" style="color:#1479B7"/>
  <text x="228" y="604" class="label" style="font-size:12.5px">Wi-Fi</text>
  <text x="228" y="621" class="detail">Laptop</text>
  <circle class="status-led " cx="297" cy="590" r="3"/></g>
<g><rect class="node" data-node="datacenter" x="350" y="577" width="134" height="70" rx="13"/>
  <use href="#server" x="356" y="597.5" width="29" height="29" style="color:#1479B7"/>
  <text x="388" y="604" class="label" style="font-size:14px">Data Center</text>
  <text x="388" y="621" class="detail">Servers</text>
  <circle class="status-led " cx="471" cy="590" r="3"/></g>
<g><rect class="node" data-node="wired" x="190" y="724" width="120" height="70" rx="13"/>
  <use href="#desktop" x="196" y="744.5" width="29" height="29" style="color:#1479B7"/>
  <text x="228" y="751" class="label" style="font-size:12.5px">Wired LAN</text>
  <text x="228" y="768" class="detail">VLANs</text>
  <circle class="status-led " cx="297" cy="737" r="3"/></g>
<text x="250" y="820" text-anchor="middle" class="caption" style="font-size:10px">CONCEPTUAL DESIGN · NOT LIVE TELEMETRY</text>
</svg>
